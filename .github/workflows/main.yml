name: Update HTML and README

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      # Step 1
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2
      - name: Show actor
        run: echo "Triggered by ${{ github.actor }}"

      - name: Update index.html (Team Leader)
        if: github.actor == 'Adnaan-0310'
        run: sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(date)"'</p>' index.html

      # Step 3
      - name: Update README
        run: |
          echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md

      # Step 4
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Workflow: Updated HTML and README for ${{ github.actor }}" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
